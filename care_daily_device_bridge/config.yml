name: "Care Daily Device Bridge"
description: "Bridge between Home Assistant and Care Daily Cloud for real-time device monitoring"
version: "0.9.2"
slug: "care_daily_device_bridge"
image: "ghcr.io/peoplepower/care-daily-bridge-{arch}"
arch:
  - aarch64
  - amd64
  - armv7
startup: "application"
boot: "auto"
init: false
homeassistant_api: true
hassio_api: true
hassio_role: manager
hassio_network: true
auth_api: true
panel_icon: "mdi:bridge"
panel_title: "Care Daily Bridge"
ingress: true
ingress_port: 5000
webui: "[PROTO:ssl]://[HOST]:[PORT:5000]"
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "Web UI port"
map:
  - "config:rw"
  - "share:rw"
options:
  db_path: "/data/care_daily_bridge.db"
  ha_refresh_interval: 10
  care_daily_cloud_base_url:
    - "https://app.peoplepowerco.com"
    - "https://eu.caredaily.ai"
    - "https://sboxall.peoplepowerco.com"
  hub_name: ""
  time_zone: ""
  hub_area: ""
  auto_add_future_devices: false
  nightly_sync_time: "03:00"
  heartbeat_interval_seconds: 60
  setup_wizard_enabled: false
  cloud_url: "https://sboxall.peoplepowerco.com"
  username: ""
  password: ""
  passcode: ""
  location_name: ""
  max_devices_per_message: 10
  registry_add_inter_chunk_delay_seconds: 60.0
  allowed_device_categories:
    - "hardware"
    - "mobile_app"
    - "service"
    - "kiosk_display"
schema:

  db_path: "str?"
  ha_refresh_interval: int
  care_daily_cloud_base_url:
    - str
  hub_name: "str?"
  time_zone: "str?"
  hub_area: "str?"
  auto_add_future_devices: "bool?"
  nightly_sync_time: "str?"
  heartbeat_interval_seconds: "int?"
  setup_wizard_enabled: "bool?"
  cloud_id: "int?"
  cloud_url: "str?"
  username: "str?"
  password: "password?"
  passcode: "str?"
  location_id: "int?"
  location_name: "str?"
  max_devices_per_message: "int?"
  registry_add_inter_chunk_delay_seconds: "float?"
  allowed_device_categories:
    - str


