name: "Care Daily Edge"
description: "Edge gateway between Home Assistant and Care Daily Cloud for real-time device monitoring and localized edge computing"
version: "0.14.0"
slug: "care_daily_device_bridge"
image: "ghcr.io/peoplepower/care-daily-bridge-{arch}"
arch:
  - aarch64
  - amd64
startup: "application"
boot: "auto"
init: false
# Least privilege (H-3, #64): every capability below is justified by a call site.
# Anything not listed was removed because no code path exercises it.
#
# homeassistant_api: clients/device_client.py reaches Core through
#   http://supervisor/core (states, registries, service calls).
homeassistant_api: true
# hassio_api + hassio_role: services/virtual_hub_service.py reads the Supervisor
#   core/info, os/info, supervisor/info, network/info and host/info endpoints via
#   DeviceClient.fetch_hassio_info. The 'default' role permits exactly the
#   /<component>/info paths and denies mutating routes such as /host/reboot,
#   /supervisor/update and /addons/self/options.
hassio_api: true
hassio_role: default
panel_icon: "mdi:router-network"
panel_title: "Care Daily Edge"
ingress: true
ingress_port: 5000
webui: "[PROTO:ssl]://[HOST]:[PORT:5000]"
ports:
  5000/tcp: null
ports_description:
  5000/tcp: "Optional direct access (disabled by default; use Ingress)"
# Supervisor probes this endpoint and restarts the add-on when it stops
# answering (H-5, #66), which is what turns a wedged worker into a recovery
# instead of a silent outage. It resolves to the add-on's own container
# address, so it works with 5000/tcp unpublished.
watchdog: "http://[HOST]:[PORT:5000]/healthz"
# No map: entry. All persistent state lives under /data, which Supervisor always
# mounts for an add-on without an explicit map. Nothing reads or writes the
# Home Assistant config or share trees.
options:
  db_path: "/data/devices.db"
  ha_refresh_interval: 10
  care_daily_cloud_base_url:
    - "https://app.peoplepowerco.com"
    - "https://sboxall.peoplepowerco.com"
  hub_name: ""
  time_zone: ""
  hub_area: ""
  auto_add_future_devices: false
  nightly_sync_time: "03:00"
  heartbeat_interval_seconds: 60
  setup_wizard_enabled: false
  session_cookie_secure: false
  cloud_url: "https://sboxall.peoplepowerco.com"
  username: ""
  password: ""
  passcode: ""
  location_name: ""
  max_devices_per_message: 10
  registry_add_inter_chunk_delay_seconds: 60.0
  allowed_device_categories:
    - "hardware"
    - "mobile_app"
    - "service"
    - "kiosk_display"
  # Security-critical domains this deployment re-enables for remote control.
  # Empty means inbound commands may not operate locks, alarms, valves or water
  # heaters. Documented in docs/publishing/DOCS.md.
  command_opt_in_domains: []
  # Publishing noise filters. Documented in
  # docs/architecture/MQTT_ATTRIBUTE_MAPPING.md; the defaults below must stay
  # in step with the AppSettings defaults in settings.py.
  excluded_entity_domains:
    - "button"
    - "update"
    - "scene"
    - "automation"
    - "script"
    - "conversation"
    - "tts"
    - "todo"
    - "notify"
  attribute_blacklist_prefixes:
    - "android."
    - "com."
    - "appInfo_"
    - "largeIcon_"
    - "infoText_"
  attribute_blacklist_suffixes:
    - "_is_clearable"
  attribute_blacklist_keys:
    - "icon"
    - "entity_picture"
    - "display_precision"
    - "release_summary"
    - "release_url"
    - "attribution"
    - "editable"
  attribute_blacklist_contains:
    - "_com."
    - "_org."
    - "_net."
    - "_io."
schema:

  db_path: "str?"
  ha_refresh_interval: int
  care_daily_cloud_base_url:
    - str
  hub_name: "str?"
  time_zone: "str?"
  hub_area: "str?"
  auto_add_future_devices: "bool?"
  nightly_sync_time: "str?"
  heartbeat_interval_seconds: "int?"
  setup_wizard_enabled: "bool?"
  session_cookie_secure: "bool?"
  cloud_id: "int?"
  cloud_url: "str?"
  username: "str?"
  password: "password?"
  passcode: "str?"
  location_id: "int?"
  location_name: "str?"
  max_devices_per_message: "int?"
  registry_add_inter_chunk_delay_seconds: "float?"
  allowed_device_categories:
    - str
  command_opt_in_domains:
    - str
  excluded_entity_domains:
    - str
  attribute_blacklist_prefixes:
    - str
  attribute_blacklist_suffixes:
    - str
  attribute_blacklist_keys:
    - str
  attribute_blacklist_contains:
    - str


